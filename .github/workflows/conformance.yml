name: conformance

# Conformance gate for the envelope. Section 8 of spec/envelope.md defines
# "conformant" in prose; this makes it executable.
#
# Two layers, and the split is what makes the gate trustworthy:
#
#   deterministic (on: pull_request). Run a profile's generator, then its
#   verifier, and let the exit code decide. Keys and signatures are fresh on
#   every run (ML-DSA and Ed25519 sign with randomness), so asserting
#   regenerated bytes can never work; what is stable is each vector's expected
#   disposition. verify.py asserts verifier-layer and consumer-layer outcomes
#   per vector and exits non-zero on any mismatch. No network in this job, so
#   a PR only goes red for a real reason.
#
#   live (on: schedule). cross-verify.mjs mints a real KYA against Facet's
#   production issuer and fetches two live JWKS. Worth having, but it depends
#   on the network and on two issuers being up, so a PR must never go red
#   because a JWKS was slow that minute. It runs on the daily cron instead.

on:
  pull_request:
    paths:
      - 'algovoi-provenance/**'
      - '.github/workflows/conformance.yml'
  workflow_dispatch: {}
  schedule:
    # daily, 07:11 UTC; only the live job listens to this
    - cron: '11 7 * * *'

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # Deterministic gate. Runs on every PR touching the profile. No network.
  # ---------------------------------------------------------------------
  algovoi-provenance:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The profile lands with PR #7. On a ref that predates it, the gate
      # skips with a notice instead of failing on a missing path, so this
      # workflow can merge on its own and the gate arms itself the moment
      # the profile directory exists.
      - name: profile present on this ref
        id: profile
        run: |
          if [ -d algovoi-provenance ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "algovoi-provenance is not on this ref yet (lands with #7); skipping"
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.profile.outputs.present == 'true' 
        with:
          python-version: '3.11'
      # Same three the profile README documents: pqcrypto (FIPS 204 ML-DSA),
      # rfc8785 (JCS canonicalization) and cryptography (the Ed25519 half of
      # the hybrid vectors). Pinned here so the gate does not depend on a
      # reader following the README correctly.
      - name: deps
        if: steps.profile.outputs.present == 'true'
        run: pip install pqcrypto cryptography rfc8785
      - name: generate vectors (fresh key every run)
        if: steps.profile.outputs.present == 'true'
        working-directory: algovoi-provenance
        run: python gen_vectors.py
      - name: verify (the gate; 7/7 or red)
        if: steps.profile.outputs.present == 'true'
        working-directory: algovoi-provenance
        run: python verify.py

  # ---------------------------------------------------------------------
  # Live end to end. Cron only. Mints a real KYA and verifies two
  # production issuers offline. Never blocks a PR.
  # ---------------------------------------------------------------------
  cross-verify-live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: install
        working-directory: cross-verify
        run: npm i
      - name: live end to end (identity + risk, two real JWKS)
        working-directory: cross-verify
        run: node cross-verify.mjs
